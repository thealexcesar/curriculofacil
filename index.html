<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currículo Fácil</title>
  <meta name="description" content="Crie seu currículo profissional em minutos, de graça, sem cadastro.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Currículo Fácil">
  <meta property="og:description" content="Crie seu currículo profissional em minutos, de graça, sem cadastro.">
  <meta property="og:url" content="https://thealexcesar.github.io/curriculofacil/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Currículo Fácil">
  <meta name="twitter:description" content="Crie seu currículo profissional em minutos, de graça, sem cadastro.">
  <link rel="canonical" href="https://thealexcesar.github.io/curriculofacil/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="icon-add" viewBox="0 0 24 24"><path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></symbol>
  <symbol id="icon-arrow_back" viewBox="0 0 24 24"><path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z"/></symbol>
  <symbol id="icon-arrow_forward" viewBox="0 0 24 24"><path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59L9 16.17Z"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"/></symbol>
  <symbol id="icon-error" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12S6.48 22 12 22 22 17.52 22 12 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z"/></symbol>
  <symbol id="icon-print" viewBox="0 0 24 24"><path d="M19 8H5C3.34 8 2 9.34 2 11V17H6V21H18V17H22V11C22 9.34 20.66 8 19 8ZM16 19H8V14H16V19ZM19 12C18.45 12 18 11.55 18 11C18 10.45 18.45 10 19 10C19.55 10 20 10.45 20 11C20 11.55 19.55 12 19 12ZM18 3H6V7H18V3Z"/></symbol>
  <symbol id="icon-check_circle" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12S6.48 22 12 22 22 17.52 22 12 17.52 2 12 2ZM10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"/></symbol>
  <symbol id="icon-cancel" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12S6.48 22 12 22 22 17.52 22 12 17.52 2 12 2ZM17 15.59L15.59 17L12 13.41L8.41 17L7 15.59L10.59 12L7 8.41L8.41 7L12 10.59L15.59 7L17 8.41L13.41 12L17 15.59Z"/></symbol>
  <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M1 21H23L12 2L1 21ZM13 18H11V16H13V18ZM13 14H11V10H13V14Z"/></symbol>
  <symbol id="icon-info" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12S6.48 22 12 22 22 17.52 22 12 17.52 2 12 2ZM13 17H11V11H13V17ZM13 9H11V7H13V9Z"/></symbol>
  <symbol id="icon-download" viewBox="0 0 24 24"><path d="M19 9H15V3H9V9H5L12 16L19 9ZM5 18V20H19V18H5Z"/></symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M9 16H15V10H19L12 3L5 10H9V16ZM5 18H19V20H5V18Z"/></symbol>
  <symbol id="icon-mic" viewBox="0 0 24 24"><path d="M12 14C13.66 14 15 12.66 15 11V5C15 3.34 13.66 2 12 2C10.34 2 9 3.34 9 5V11C9 12.66 10.34 14 12 14ZM17 11C17 14.53 14.39 16.44 12 16.44C9.61 16.44 7 14.53 7 11H5C5 14.72 7.82 17.71 11 18.35V21H13V18.35C16.18 17.71 19 14.72 19 11H17Z"/></symbol>
  <symbol id="icon-expand_more" viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17L7.41 8.59L6 10L12 16L18 10L16.59 8.59Z"/></symbol>
</svg>

<div class="app">

  <header class="app-header no-print">
    <div class="app-header-content">
      <svg class="app-logo" viewBox="0 0 280 60" width="280" height="60" aria-label="Currículo Fácil" role="img" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="2" width="42" height="56" rx="6" fill="#1e3a8a"/>
        <rect x="8" y="10" width="26" height="5" rx="2.5" fill="white" opacity="0.95"/>
        <rect x="8" y="19" width="18" height="2.5" rx="1.25" fill="white" opacity="0.6"/>
        <rect x="8" y="25" width="26" height="2" rx="1" fill="white" opacity="0.4"/>
        <rect x="8" y="30" width="20" height="2" rx="1" fill="white" opacity="0.4"/>
        <rect x="8" y="35" width="24" height="2" rx="1" fill="white" opacity="0.4"/>
        <rect x="8" y="43" width="26" height="2" rx="1" fill="white" opacity="0.4"/>
        <rect x="8" y="48" width="18" height="2" rx="1" fill="white" opacity="0.4"/>
        <rect x="34" y="0" width="6" height="10" rx="1.5" fill="#0ea5e9"/>
        <text x="52" y="33" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">curriculo</text>
        <text x="52" y="50" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#0ea5e9">fácil</text>
      </svg>
      <div class="header-controls">
        <button class="font-size-btn" id="font-size-toggle" data-i18n-aria="a11y.fontSize.aria" aria-pressed="false">A+</button>
      </div>
    </div>
    <p class="app-subtitle" data-i18n="app.subtitle"></p>
  </header>

  <p class="steps-caption no-print" id="steps-caption" aria-live="polite"></p>

  <nav class="steps-nav no-print">
    <div class="step-item" data-step="1">
      <span class="step-number">1</span>
      <span class="step-label" data-i18n="nav.step.1"></span>
    </div>
    <div class="step-line"></div>
    <div class="step-item" data-step="2">
      <span class="step-number">2</span>
      <span class="step-label" data-i18n="nav.step.2"></span>
    </div>
    <div class="step-line"></div>
    <div class="step-item" data-step="3">
      <span class="step-number">3</span>
      <span class="step-label" data-i18n="nav.step.3"></span>
    </div>
    <div class="step-line"></div>
    <div class="step-item" data-step="4">
      <span class="step-number">4</span>
      <span class="step-label" data-i18n="nav.step.4"></span>
    </div>
    <div class="step-line"></div>
    <div class="step-item" data-step="5">
      <span class="step-number">5</span>
      <span class="step-label" data-i18n="nav.step.5"></span>
    </div>
  </nav>

  <div class="progress-wrap no-print" data-i18n-aria="progress.aria">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="progress-label" id="progress-label">0%</span>
  </div>

  <div class="data-actions no-print">
    <button type="button" class="btn-add-small" id="export-data">
      <svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg>
      <span data-i18n="btn.export"></span>
    </button>
    <button type="button" class="btn-add-small" id="import-data">
      <svg class="icon" aria-hidden="true"><use href="#icon-upload"></use></svg>
      <span data-i18n="btn.import"></span>
    </button>
    <input type="file" id="import-file-input" accept="application/json" hidden>
  </div>

  <div class="view-toggle no-print">
    <button class="view-btn view-btn--active" id="toggle-form" data-i18n="toggle.form"></button>
    <button class="view-btn" id="toggle-preview" data-i18n="toggle.preview"></button>
  </div>

  <main class="layout">
    <div class="form-panel no-print">

      <section id="step-1" class="step-section active">
        <h2 class="section-title" data-i18n="section.personal"></h2>

        <div class="field">
          <label for="name" data-i18n="field.name.label"></label>
          <input type="text" id="name" data-i18n-placeholder="field.name.placeholder" autocomplete="name" spellcheck="true" autocorrect="on">
          <span class="field-hint" id="name-hint"></span>
        </div>

        <div class="field">
          <label for="job-title" data-i18n="field.jobTitle.label"></label>
          <input type="text" id="job-title" autocomplete="off" data-i18n-placeholder="field.jobTitle.placeholder" spellcheck="true" autocorrect="on" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="job-title-suggestions">
          <ul class="autocomplete-list" id="job-title-suggestions" role="listbox" hidden></ul>
          <span class="field-hint" id="job-title-hint"></span>
        </div>

        <div class="field">
          <label for="email" data-i18n="field.email.label"></label>
          <input type="email" id="email" data-i18n-placeholder="field.email.placeholder" autocomplete="email">
          <span class="field-hint" id="email-hint"></span>
        </div>

        <div class="field">
          <label data-i18n="field.phone.label"></label>
          <div class="phone-entry">
            <input type="tel" id="phone" data-i18n-placeholder="field.phone.placeholder" autocomplete="tel">
            <label class="checkbox-label" title="WhatsApp">
              <input type="checkbox" id="phone-whatsapp">
              <img src="assets/icons/whatsapp.svg" class="whatsapp-icon" alt="WhatsApp">
            </label>
          </div>
          <span class="field-hint" id="phone-hint"></span>
          <div id="extra-phones"></div>
          <button type="button" class="btn-add-small" id="add-phone">
            <svg class="icon" aria-hidden="true"><use href="#icon-add"></use></svg>
            <span data-i18n="btn.add" data-i18n-item="field.phone.label"></span>
          </button>
        </div>

        <div class="field">
          <label for="location" data-i18n="field.location.label"></label>
          <input type="text" id="location" data-i18n-placeholder="field.location.placeholder" autocomplete="address-level2" spellcheck="true" autocorrect="on">
        </div>

        <div class="field">
          <label for="linkedin" data-i18n="field.linkedin.label"></label>
          <input type="text" id="linkedin" data-i18n-placeholder="field.linkedin.placeholder" autocomplete="off">
        </div>

        <div class="field">
          <label for="cnh-category" data-i18n="field.cnhCategory.label"></label>
          <select id="cnh-category">
            <option value="" data-i18n="field.cnhCategory.none"></option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </div>

        <details class="field-collapsible">
          <summary>
            <span data-i18n="field.extraDocs.toggle"></span>
            <svg class="icon field-collapsible-chevron" aria-hidden="true"><use href="#icon-expand_more"></use></svg>
          </summary>
          <div class="field-collapsible-content">
            <div class="field-row">
              <div class="field">
                <label for="rg" data-i18n="field.rg.label"></label>
                <input type="text" id="rg" data-i18n-placeholder="field.rg.placeholder" autocomplete="off">
              </div>
              <div class="field">
                <label for="rg-issuer" data-i18n="field.rgIssuer.label"></label>
                <input type="text" id="rg-issuer" data-i18n-placeholder="field.rgIssuer.placeholder" autocomplete="off">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="rg-issue-date" data-i18n="field.rgIssueDate.label"></label>
                <input type="date" id="rg-issue-date">
              </div>
              <div class="field">
                <label for="cpf" data-i18n="field.cpf.label"></label>
                <input type="text" id="cpf" data-i18n-placeholder="field.cpf.placeholder" autocomplete="off" inputmode="numeric">
              </div>
            </div>
            <div class="field">
              <label for="voter-id" data-i18n="field.voterId.label"></label>
              <input type="text" id="voter-id" data-i18n-placeholder="field.voterId.placeholder" autocomplete="off" inputmode="numeric">
            </div>
          </div>
        </details>
      </section>

      <section id="step-2" class="step-section">
        <h2 class="section-title" data-i18n="section.profile"></h2>
        <div class="field">
          <label for="profile" data-i18n="field.profile.label"></label>
          <p class="field-tip">
            <svg class="icon" aria-hidden="true"><use href="#icon-info"></use></svg>
            <span data-i18n="tips.profile"></span>
          </p>
          <textarea id="profile" rows="8" data-i18n-placeholder="field.profile.placeholder" spellcheck="true" autocorrect="on"></textarea>
          <div class="char-counter">
            <span id="profile-count">0</span>/400
          </div>
          <span class="field-hint" id="profile-hint"></span>
        </div>
      </section>

      <section id="step-3" class="step-section">
        <h2 class="section-title" data-i18n="section.experience"></h2>
        <div id="experience-list"></div>
        <button type="button" class="btn-add-small" id="add-experience">
          <svg class="icon" aria-hidden="true"><use href="#icon-add"></use></svg>
          <span data-i18n="btn.add" data-i18n-item="section.experience"></span>
        </button>
      </section>

      <section id="step-4" class="step-section">
        <h2 class="section-title" data-i18n="section.education"></h2>
        <div id="education-list"></div>
        <button type="button" class="btn-add-small" id="add-education">
          <svg class="icon" aria-hidden="true"><use href="#icon-add"></use></svg>
          <span data-i18n="btn.add" data-i18n-item="section.education"></span>
        </button>
      </section>

      <section id="step-5" class="step-section">
        <h2 class="section-title" data-i18n="section.skills"></h2>

        <div id="skill-section">
          <h3 class="section-subtitle" data-i18n="section.skill"></h3>
        </div>

        <div id="language-section">
          <h3 class="section-subtitle" data-i18n="section.language"></h3>
          <div id="language-list"></div>
          <button type="button" class="btn-add-small" id="add-language">
            <svg class="icon" aria-hidden="true"><use href="#icon-add"></use></svg>
            <span data-i18n="btn.add" data-i18n-item="section.language"></span>
          </button>
        </div>
      </section>

      <div class="form-nav">
        <button class="btn btn-secondary" id="prev-btn" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow_back"></use></svg>
          <span data-i18n="btn.prev"></span>
        </button>
        <button class="btn btn-primary" id="next-btn">
          <span data-i18n="btn.next"></span>
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow_forward"></use></svg>
        </button>
        <button class="btn btn-success" id="finish-btn" style="display:none">
          <svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg>
          <span data-i18n="btn.finish"></span>
        </button>
      </div>
    </div>

    <div class="preview-panel">
      <div class="preview-header no-print">
        <span class="preview-label" data-i18n="preview.label"></span>
        <div class="preview-header-actions">
          <button class="btn btn-whatsapp btn-sm" id="whatsapp-share-btn">
            <img src="assets/icons/whatsapp.svg" alt="" width="18" height="18">
            <span data-i18n="btn.whatsappShare"></span>
          </button>
          <button class="btn btn-primary btn-sm" id="print-btn">
            <svg class="icon" aria-hidden="true"><use href="#icon-print"></use></svg>
            <span data-i18n="btn.print"></span>
          </button>
        </div>
      </div>
      <div class="template-switcher no-print">
        <div class="template-switcher-row">
          <span class="template-switcher-label" data-i18n="template.label"></span>
          <button class="template-btn template-btn--active" data-template="classic" data-i18n="template.classic"></button>
          <button class="template-btn" data-template="modern" data-i18n="template.modern"></button>
        </div>
        <div class="color-swatches" id="color-swatches">
          <button class="color-swatch color-swatch--active" data-color="blue" style="background:#1e3a8a" data-i18n-aria="template.color.blue"></button>
          <button class="color-swatch" data-color="charcoal" style="background:#1f2937" data-i18n-aria="template.color.charcoal"></button>
          <button class="color-swatch" data-color="navy" style="background:#0f172a" data-i18n-aria="template.color.navy"></button>
          <button class="color-swatch" data-color="indigo" style="background:#312e81" data-i18n-aria="template.color.indigo"></button>
          <button class="color-swatch" data-color="plum" style="background:#6b21a8" data-i18n-aria="template.color.plum"></button>
          <button class="color-swatch" data-color="wine" style="background:#7f1d1d" data-i18n-aria="template.color.wine"></button>
          <button class="color-swatch" data-color="rust" style="background:#7c2d12" data-i18n-aria="template.color.rust"></button>
          <button class="color-swatch" data-color="teal" style="background:#134e4a" data-i18n-aria="template.color.teal"></button>
          <button class="color-swatch" data-color="green" style="background:#166534" data-i18n-aria="template.color.green"></button>
        </div>
      </div>
      <div class="cv-preview-wrapper">
        <div id="cv-preview" class="cv-preview">
          <p class="preview-empty" data-i18n="preview.empty"></p>
        </div>
      </div>
    </div>

  </main>

  <button type="button" class="btn btn-secondary cover-letter-toggle no-print" id="cover-letter-toggle" data-i18n="coverLetter.toggle"></button>

  <section id="cover-letter-panel" class="cover-letter-panel no-print">
    <div class="layout">
      <div class="form-panel">
        <h2 class="section-title" data-i18n="coverLetter.title"></h2>

        <div class="field">
          <label for="cl-company" data-i18n="coverLetter.company.label"></label>
          <input type="text" id="cl-company" data-i18n-placeholder="coverLetter.company.placeholder" spellcheck="true" autocorrect="on">
        </div>

        <div class="field">
          <label for="cl-body" data-i18n="coverLetter.body.label"></label>
          <textarea id="cl-body" rows="14" spellcheck="true" autocorrect="on"></textarea>
        </div>

        <button type="button" class="btn btn-primary" id="cl-print-btn">
          <svg class="icon" aria-hidden="true"><use href="#icon-print"></use></svg>
          <span data-i18n="btn.print"></span>
        </button>
      </div>

      <div class="preview-panel">
        <div class="cv-preview-wrapper">
          <div id="cl-preview" class="cl-preview">
            <p class="preview-empty" data-i18n="coverLetter.empty"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="app-footer no-print">
    <p data-i18n="footer.ods"></p>
  </footer>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
